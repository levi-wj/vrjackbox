<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="GameStyle.css">
    <title>Join Game</title>

    <style>
        main {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: rgb(53, 53, 53);
        }

        form > label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1em;
        }

        form > label > input {
            margin-left: .5em;
        }

        form > button {
            width: 100%;
        }
    </style>
</head>

<script>
    function storeNickname(form, event) {
        // Stop the form from navigating away immediately
        event.preventDefault();

        const nicknameInput = form['nickname'];
        const joinButton = document.getElementById('joinButton');

        if (nicknameInput?.value) {
            // Disable the button to prevent double submission
            joinButton.disabled = true;
            joinButton.textContent = 'Joining...';

            const nickname = nicknameInput.value;
            sessionStorage.setItem('nickname', nickname);

            fetch('/AddPlayer?nickname=' + encodeURIComponent(nickname))
                .then(response => {
                    if (!response.ok) {
                        console.error('Server responded with an error:', response.status);
                        alert('Could not join. Is the game running on the headset?');
                        // Re-enable the button on failure
                        joinButton.disabled = false;
                        joinButton.textContent = 'Join';
                        return;
                    }
                    // 3. Manually navigate ONLY after a successful fetch
                    window.location.href = 'Lobby.html?';
                })
                .catch(error => {
                    console.error('Fetch error:', error);
                    alert('Could not connect to the game server.');
                    // Re-enable the button on failure
                    joinButton.disabled = false;
                    joinButton.textContent = 'Join';
                });
        } else {
            // This will still show the validation bubble if the field is empty
            nicknameInput.reportValidity();
        }
    }
</script>

<body>
    <main>
        <form onsubmit="storeNickname(this, event)" class="panel">
            <label>
                Nickname:
                <input type="text" name="nickname" maxlength="23" required>
            </label>
            <!-- Added an id to the button for easy access in JavaScript -->
            <button id="joinButton">Join</button>
        </form>
    </main>
</body>
</html>
